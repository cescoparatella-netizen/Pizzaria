<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="perfil.css">
  <script src="perfil.js" defer></script>
</head>
<body>
<header class="cabecalho-site">
  <a class="marca" href="inicio.html">
    <span class="simbolo-marca">🍕</span>
    <span>
      <strong>PIZZA</strong>
      <small>sabor em cada fatia</small>
    </span>
  </a>
  <nav class="navegacao-principal">
    <a href="inicio.html">Início</a>
    <a href="cardapio.html">Cardápio</a>
    <a href="sobre.html">Sobre</a>
    <a href="pedidos.html">Pedidos</a>
    <a href="perfil.html">Minha conta</a>
    <a href="carrinho.html">Carrinho</a>
  </nav>

  <div class="acoes-cabecalho">
    <button class="botao-icone alternar-pesquisa" aria-label="Buscar" title="Buscar">⌕</button>
    <button class="botao-icone alternar-tema" aria-label="Mudar tema" title="Mudar tema">☼</button>
    <a class="botao-icone atalho-carrinho" href="carrinho.html" title="Carrinho">🛒<span class="quantidade-carrinho">0

    </span>
  </a>
  </div>

  <div class="campo-pesquisa oculto">
    <input id="pesquisaSite" type="search" placeholder="Buscar pizza...">
    <button class="botao primario enviar-pesquisa">Buscar</button>
  </div>
</header>

<main class="conteiner">

<secao class="titulo-pagina">
  <p class="subtitulo-banner">SEUS DADOS</p>
  <h1>Minha conta</h1>
  <p>Consulte e atualize suas informações.</p>
</secao>
<form id="formularioPerfil" class="formulario-perfil">
  <label for="nomePerfil">Nome completo</label>
  <input id="nomePerfil" required>
  <label for="emailPerfil">E-mail</label>
  <input id="emailPerfil" type="email" required>
  <label for="telefonePerfil">Telefone</label>
  <input id="telefonePerfil" placeholder="(31) 99999-9999" maxlength="15">
  <label for="enderecoPerfil">Endereço de entrega</label>
  <input id="enderecoPerfil" placeholder="Rua, número, bairro">
  <button class="botao primario" type="submit">Salvar alterações</button><p id="mensagemPerfil" class="mensagem-formulario"></p>
  <button id="botaoSair" class="botao secundario" type="button">Sair da conta</button>
</form>

</main>
<footer class="rodape-site">PIZZA — sabor em cada fatia. <span>Feito para atividade escolar.</span></footer>
</body></html>
